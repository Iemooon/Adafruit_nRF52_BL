name: Build

# ---------------------------------------------------------------------------
# Manual-only build workflow.
#
# All automatic triggers (pull_request / push / release) were removed on
# purpose: this fork must never spend CI minutes on its own. A build happens
# only when someone opens the Actions tab and presses "Run workflow".
#
# When you do run it, you choose what gets built:
#   board = bluemicro_nrf52833,nice_nano,pca10059   -> those three (the default)
#   board = bluemicro_nrf52833                      -> just one
#   board = all                                     -> every board under src/boards/
#   board = (left empty)                            -> the default three
#
# volume_labels picks the UF2 drive name baked into the firmware:
#   volume_labels = KEYPOINT         -> one build; the drive shows KEYPOINT
#   volume_labels = KEYPOINT,NRF52BOOT -> two builds, one subdirectory each
#   volume_labels = (left empty)     -> one build; the drive shows NRF52BOOT
# The label is a compile-time macro, so every label in the list costs one full
# rebuild. Each board's artifact gets one subdirectory per label, and the label
# is appended to the version as well, so the file names separate them too:
#   pca10059_bootloader-0.11.0-capy-KEYPOINT_nosd.hex
# A label must be 1-11 characters of A-Z a-z 0-9 . _ - and start with a letter
# or a digit; anything else is rejected before the build starts.
#
# The build steps themselves are the stock upstream ones, so the resulting
# binaries stay comparable with official releases.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      board:
        description: 'Board(s) to build: comma/space separated names, or "all"'
        required: true
        default: 'bluemicro_nrf52833,nice_nano,pca10059'
        type: string
      volume_labels:
        description: 'UF2 volume label(s): comma/space separated, max 11 chars each (e.g. KEYPOINT). Empty = NRF52BOOT'
        required: false
        default: ''
        type: string
      artifact_prefix:
        description: 'Optional prefix for artifact names (leave empty for none)'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Turn the manual inputs into the JSON array the build matrix expects, and
  # reject bad input here rather than deep inside a build job.
  # -------------------------------------------------------------------------
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set matrix
        id: set-matrix
        working-directory: src/boards
        run: |
          set -eu

          # Every board that actually exists, one per line.
          AVAILABLE=$(ls -d */ | sed 's/\/$//')

          REQUESTED="${{ inputs.board }}"
          [ -n "$REQUESTED" ] || REQUESTED="bluemicro_nrf52833,nice_nano,pca10059"

          if [ "$REQUESTED" = "all" ]; then
            SELECTED="$AVAILABLE"
            echo "Building ALL boards."
          else
            # Split on commas and/or whitespace, drop empties.
            SELECTED=$(echo "$REQUESTED" | tr ',' '\n' | tr -s '[:space:]' '\n' | sed '/^$/d')
          fi

          # Validate every requested name against the real directory list.
          MISSING=""
          for b in $SELECTED; do
            if ! echo "$AVAILABLE" | grep -qx "$b"; then
              MISSING="$MISSING $b"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo "::error::Unknown board(s):$MISSING"
            echo "Available boards:"
            echo "$AVAILABLE"
            exit 1
          fi

          MATRIX_JSON=$(echo "$SELECTED" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix=$MATRIX_JSON"
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

      - name: Check volume labels
        # Checked once, up front, so a bad label fails immediately instead of
        # after every board in the matrix has burned a full build.
        #
        # 11 characters is the hard ceiling: ghostfat.c initialises
        # `uint8_t VolumeLabel[11]` straight from UF2_VOLUME_LABEL
        # (src/usb/uf2/ghostfat.c:209), so anything longer is a compile error.
        # Shorter names are zero-padded by the C initialiser, which is what
        # the stock "NRF52BOOT  " default relies on too.
        #
        # The character set is restricted as well. The label is not only a FAT
        # field: it is appended to the version, which carries it into the
        # INFO_UF2.TXT text, into a -D C string literal, and into the artifact
        # file name. A quote or a slash would break one of those.
        env:
          # Passed through the environment rather than interpolated into the
          # script. ${{ }} is textual substitution, so a label containing a
          # quote would break the shell before the checks below could reject
          # it; through env it is only data, and the checks get to decide.
          VOLUME_LABELS: ${{ inputs.volume_labels }}
        run: |
          set -eu
          LABELS=$(echo "$VOLUME_LABELS" | tr ',' '\n' | tr -s '[:space:]' '\n' | sed '/^$/d')
          [ -n "$LABELS" ] || LABELS="NRF52BOOT"
          for L in $LABELS; do
            if [ ${#L} -gt 11 ]; then
              echo "::error::Volume label '$L' is ${#L} characters long; the maximum is 11."
              exit 1
            fi
            if ! echo "$L" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$'; then
              echo "::error::Volume label '$L' contains characters that cannot be used. Allowed: A-Z a-z 0-9 . _ - and it must start with a letter or a digit."
              exit 1
            fi
            echo "Volume label OK: $L"
          done

  build:
    needs: set-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.set-matrix.outputs.matrix) }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        # Full history plus tags: the version comes from `git describe --tags`,
        # which needs a tag reachable from the checked-out commit.
        #
        # Fetching tags explicitly because the reference point is a tag that
        # lives upstream. GitHub does not give a fork its parent's tags, so a
        # fresh clone of this fork has none at all, `git describe` then falls
        # back to a bare commit hash, and the Makefile's MAJOR.MINOR.PATCH
        # parser turns that into 0.0.0 -- which is exactly how the version
        # used to collapse. The upstream tags this build needs must therefore
        # be pushed to the fork.
        fetch-depth: 0
        fetch-tags: true
        # Top-level submodules only -- never 'recursive', lib/tinyusb carries
        # dozens of unrelated vendor SDK submodules.
        submodules: true

    - name: Install ARM GCC
      uses: carlosperate/arm-none-eabi-gcc-action@v1
      with:
        release: '12.3.Rel1'

    - name: Install Tools
      run: |
        pip3 install adafruit-nrfutil uritemplate requests intelhex setuptools

    - name: Build
      env:
        # Data, not code -- see the note on the same input in set-matrix.
        VOLUME_LABELS: ${{ inputs.volume_labels }}
      run: |
        set -eu

        # ---- Version ------------------------------------------------------
        # Take MAJOR.MINOR.PATCH from the newest reachable tag and tag our
        # build "-capy", so the artifacts stay self-identifying while the
        # version still tracks the upstream release they derive from.
        #
        # The volume label is appended to it per build, inside the loop below.
        # One run yields one image per label, and without the label the files
        # for two labels of the same board would be indistinguishable by name.
        #
        # The hard failure below is deliberate. `git describe` falls back to a
        # bare commit hash when no tag is reachable, and the Makefile's
        # MAJOR.MINOR.PATCH sed then silently yields 0.0.0. Failing loudly
        # here is the only way to keep that from shipping unnoticed.
        BASE_VER=$(git describe --tags --abbrev=0 2>/dev/null || true)
        if ! echo "$BASE_VER" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "::error::Cannot derive MAJOR.MINOR.PATCH from 'git describe --tags --abbrev=0' (got '${BASE_VER}'), which would silently produce a 0.0.0 bootloader version. Refusing to build."
          exit 1
        fi
        # ---- Volume labels ------------------------------------------------
        # An empty input means the generic label, spelled out explicitly so
        # the result does not depend on whatever a board header happens to
        # declare.
        LABELS=$(echo "$VOLUME_LABELS" | tr ',' '\n' | tr -s '[:space:]' '\n' | sed '/^$/d')
        [ -n "$LABELS" ] || LABELS="NRF52BOOT"

        STAGE="_stage/${{ matrix.board }}"

        # ---- Build, once per label ---------------------------------------
        # Everything is staged under _stage/, i.e. outside both _build/ and
        # _bin/. That matters because `make clean` removes both (Makefile:484
        # -> BUILD and BIN), so staging inside either one would have each pass
        # delete the previous pass's output.
        for L in $LABELS; do
          # The label rides along in the version, so it reaches three places
          # at once: the artifact file name (Makefile:64 OUT_NAME =
          # BOARD_bootloader-GIT_VERSION), the INFO_UF2.TXT text the drive
          # shows (ghostfat.c:128), and the BLE DIS firmware revision string
          # (Makefile:363). None of those caps the length -- ble_dis.c:143
          # sizes its attribute to whatever string it is handed -- so this is
          # safe, but it does mean a host reading the version sees the label.
          VER="${BASE_VER}-capy-${L}"
          echo "::group::BOARD=${{ matrix.board }} VOLUME_LABEL=$L GIT_VERSION=$VER"

          # The label is baked in at compile time and make cannot see CFLAGS
          # change, so the build tree has to be wiped to force a real rebuild.
          #
          # BOARD goes on this line too. Without it no board.mk is included,
          # MCU_SUB_VARIANT stays empty, and the Makefile stops at its own
          # sanity check (Makefile:144) before deleting anything.
          make BOARD=${{ matrix.board }} clean
          make BOARD=${{ matrix.board }} VOLUME_LABEL="$L" GIT_VERSION="${VER}" all

          # Collect the bootloader+MBR hex, the merged SoftDevice hex, and the
          # bootloader self-update uf2.
          #
          # The no-SD hex is the piece an upstream Adafruit release does not
          # hand you. `make copy-artifact` ships only what a board already
          # running an Adafruit bootloader consumes, and a board still on its
          # FACTORY Nordic bootloader - which is exactly what the PCA10059
          # dongle is - can use none of those three:
          #
          #   * a factory Nordic bootloader launches the application at 0x1000
          #     because there is no SoftDevice, while the merged hex is built
          #     with one and places the application at 0x26000;
          #   * update-*_nosd.uf2 carries family 0xd663823c and is a bootloader
          #     self-update, accepted only by an Adafruit bootloader already in
          #     place.
          #
          # The _nosd hex is bootloader + MBR and nothing else - precisely the
          # layout a no-SD application such as the KeyPoint NMK receiver is
          # linked for (0x1000/636K). `all` builds it (Makefile:471) and
          # `make flash` flashes it (Makefile:550).
          #
          # $(MERGED_FILE).zip is deliberately dropped. That is the Nordic DFU
          # package for OTA/Bluetooth updates, and nothing here uses it: these
          # boards get flashed over SWD, or by dragging a hex/uf2 onto the
          # bootloader. `make all` still builds the zip, it just never reaches
          # the artifact.
          mkdir -p "$STAGE/$L"
          cp _build/build-${{ matrix.board }}/*.hex "$STAGE/$L"/
          cp _build/build-${{ matrix.board }}/*.uf2 "$STAGE/$L"/

          ls -l "$STAGE/$L"
          echo "::endgroup::"
        done

    - name: Show what was produced
      run: |
        find _stage -type f | sort

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_prefix }}${{ matrix.board }}
        path: _stage/${{ matrix.board }}
